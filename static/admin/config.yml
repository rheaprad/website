# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: RheaPrad/website

media_folder: src/lib/content
public_folder: /src/lib/content
site_url: https://rheaprad.netlify.app
logout_redirect_url: https://rheaprad.netlify.app
logo:
  src: /portrait_r.webp
  show_in_header: true
collections:
  - name: books
    label: Books
    folder: src/lib/content/art-page/books
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Type, name: type, widget: hidden, default: book }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Updated,
          name: updated,
          widget: datetime,
          required: false,
          hint: "Set when the piece changes meaningfully — it appears in the site log as an update.",
        }
      - {
          label: Tags,
          name: tags,
          widget: select,
          multiple: true,
          options: ["artist-book", "picture-book", "graphic-novel", "character-design"],
        }
      - {
          label: Medium,
          name: medium,
          widget: string,
          required: false,
          hint: "e.g. Artist book, Children's picturebook, Graphic novel",
        }
      - {
          label: Pages,
          name: pages,
          widget: string,
          required: false,
          hint: "e.g. 120",
        }
      - {
          label: Dimensions,
          name: dimensions,
          widget: string,
          required: false,
          hint: "e.g. 18 × 23.5 cm",
        }
      - {
          label: Grid Cover (work index),
          name: cover_image,
          widget: image,
        }
      - {
          label: Hero Image (top of detail page),
          name: hero_image,
          widget: image,
          required: false,
          hint: "Full-bleed image at the top of the book's page. Falls back to the cover.",
        }
      - {
          label: Title Colour override,
          name: title_color,
          widget: string,
          required: false,
          hint: "Optional CSS colour. Leave blank to auto-pull the dominant colour from the hero.",
        }
      - {
          label: Nav Text on Hero,
          name: nav_theme,
          widget: select,
          default: Auto,
          options: ["Auto", "Light text", "Dark text"],
        }
      - {
          label: Gallery,
          name: gallery,
          widget: list,
          summary: "{{fields.caption}}",
          fields:
            [
              { label: Image, name: image, widget: image },
              { label: Caption, name: caption, widget: string, required: false },
            ],
        }
      - {
          label: Related Work,
          name: related,
          widget: list,
          required: false,
          hint: "Slugs of related works from any collection, e.g. canidae, tape-city. Leave empty to auto-fill.",
        }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        hint: "Optional. Overrides the automatic search/social title, description and share image for this book."
        fields:
          - { label: SEO Title, name: title, widget: string, required: false }
          - {
              label: SEO Description,
              name: description,
              widget: text,
              required: false,
            }
          - {
              label: Share Image,
              name: image,
              widget: image,
              required: false,
              hint: "1200×630 recommended. Falls back to the hero, then the site default.",
            }
      - { label: Description, name: body, widget: markdown }

  - name: illustrations
    label: Illustrations
    folder: src/lib/content/art-page/illustrations
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Type, name: type, widget: hidden, default: illustration }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Updated,
          name: updated,
          widget: datetime,
          required: false,
        }
      - {
          label: Tags,
          name: tags,
          widget: select,
          multiple: true,
          required: false,
          options: ["character-design"],
        }
      - {
          label: Caption,
          name: caption,
          widget: string,
          required: false,
          hint: "Shown under the image in the lightbox.",
        }
      - { label: Image, name: cover_image, widget: image }
      - {
          label: Related Work,
          name: related,
          widget: list,
          required: false,
          hint: "Slugs of related works from any collection, e.g. canidae, orullaigal.",
        }

  - name: comics
    label: Comics
    folder: src/lib/content/art-page/comics
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Type, name: type, widget: hidden, default: comic }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Updated,
          name: updated,
          widget: datetime,
          required: false,
        }
      - { label: Image, name: cover_image, widget: image }
      - {
          label: Related Work,
          name: related,
          widget: list,
          required: false,
          hint: "Slugs of related works from any collection.",
        }

  - name: blog
    label: Blog
    folder: src/lib/content/blog-page
    create: true
    extension: md
    format: frontmatter
    fields:
      - {
          label: Kind,
          name: kind,
          widget: select,
          default: note,
          options: ["note", "log", "essay"],
          hint: "note = short sketchbook post · log = process entry for a project · essay = long-form",
        }
      - { label: Title, name: title, widget: string, required: false }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Updated,
          name: updated,
          widget: datetime,
          required: false,
        }
      - {
          label: Project,
          name: project,
          widget: string,
          required: false,
          hint: "Work slug this post belongs to (required for logs), e.g. canidae. The post appears on that work's page.",
        }
      - {
          label: Description,
          name: description,
          widget: string,
          required: false,
        }
      - { label: Image, name: image, widget: image, required: false }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        hint: "Optional. Overrides the automatic search/social title, description and share image for this post."
        fields:
          - { label: SEO Title, name: title, widget: string, required: false }
          - {
              label: SEO Description,
              name: description,
              widget: text,
              required: false,
            }
          - {
              label: Share Image,
              name: image,
              widget: image,
              required: false,
              hint: "1200×630 recommended. Falls back to the post image, then the site default.",
            }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: now
    label: Now
    files:
      - name: now
        label: Now Page
        file: src/lib/content/now-page/now.md
        fields:
          - { label: Updated, name: updated, widget: datetime }
          - { label: Body, name: body, widget: markdown }

  - name: home
    label: Home
    files:
      - name: home
        label: Home Page
        file: src/lib/content/home-page/home.md
        fields:
          - {
              label: Featured Book Cover,
              name: featured_book,
              widget: image,
              required: false,
            }
          - {
              label: Featured Comic Cover,
              name: featured_comic,
              widget: image,
              required: false,
            }
          - label: Carousel
            name: carousel
            widget: list
            label_singular: Slide
            summary: "{{fields.caption}}"
            fields:
              - { label: Image, name: image, widget: image }
              - {
                  label: Caption,
                  name: caption,
                  widget: string,
                  required: false,
                }
          - label: SEO
            name: seo
            widget: object
            collapsed: true
            required: false
            hint: "Optional. Overrides the site's default homepage title, description and share image."
            fields:
              - { label: SEO Title, name: title, widget: string, required: false }
              - {
                  label: SEO Description,
                  name: description,
                  widget: text,
                  required: false,
                }
              - {
                  label: Share Image,
                  name: image,
                  widget: image,
                  required: false,
                  hint: "1200×630 recommended. Falls back to the site default.",
                }

  - name: about
    label: About
    files:
      - name: about
        label: About Page
        file: src/lib/content/about-page/about.md
        fields:
          - { label: Photo, name: photo, widget: image }
          - {
              label: Photo Caption,
              name: photo_caption,
              widget: string,
              required: false,
              hint: "Italic caption shown under the photo.",
            }
          - {
              label: Resume,
              name: resume,
              widget: file,
              required: false,
              hint: "PDF or link the RESUME button points to.",
            }
          - {
              label: LinkedIn URL,
              name: linkedin,
              widget: string,
              required: false,
            }
          - { label: Email, name: email, widget: string, required: false }
          - {
              label: Instagram URL,
              name: instagram,
              widget: string,
              required: false,
            }
          - {
              label: BlueSky URL,
              name: bluesky,
              widget: string,
              required: false,
            }
          - {
              label: Behance URL,
              name: behance,
              widget: string,
              required: false,
            }
          - label: SEO
            name: seo
            widget: object
            collapsed: true
            required: false
            hint: "Optional. Overrides the automatic search/social title, description and share image for the About page."
            fields:
              - { label: SEO Title, name: title, widget: string, required: false }
              - {
                  label: SEO Description,
                  name: description,
                  widget: text,
                  required: false,
                }
              - {
                  label: Share Image,
                  name: image,
                  widget: image,
                  required: false,
                  hint: "1200×630 recommended. Falls back to the profile photo, then the site default.",
                }
          - { label: Bio, name: body, widget: markdown }
