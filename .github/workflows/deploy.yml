name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vite-imagetools regenerates every avif/webp/jpg variant of all ~120
      # source images from scratch on a cold cache, which is the whole of the
      # build's wall clock. Restore-keys matter as much as the exact key: one
      # new image should reuse the other hundred's variants rather than redo
      # the lot.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('src/lib/content/**/*.webp', 'src/lib/content/**/*.jpg', 'src/lib/content/**/*.jpeg', 'src/lib/content/**/*.png') }}
          restore-keys: imagetools-
      - run: pnpm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
      # On subpath deploys (redesign repo) drop CNAME so it can't claim the
      # production custom domain; keep it for the root/custom-domain build.
      - if: vars.BASE_PATH != ''
        run: rm -f build/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
